<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Langit Nusantara</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #0b1329;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            width: 1280px;
            height: 800px;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            display: block;
            background: #0b1329;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="1280" height="800"></canvas>
    <script type="module" src="src/config.js"></script>
    <script type="module" src="src/world.js"></script>
    <script type="module" src="src/render.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
